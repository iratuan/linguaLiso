<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'" />
    <title>English Teacher Local</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0b0f;
        color: #cbd5e1;
        font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
        -webkit-app-region: drag;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        box-sizing: border-box;
      }
      img {
        width: 300px;
        height: auto;
        filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.55));
      }
      .status {
        font-size: 13px;
        color: #94a3b8;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="assets/splash-logo.png" alt="Logo" />
      <p class="status">Preparando o professor…</p>
    </div>
  </body>
</html>
